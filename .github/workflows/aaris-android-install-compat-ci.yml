name: Aaris Android installation compatibility regression
on:
  pull_request:
    paths:
      - 'ProjectSettings/ProjectSettings.asset'
      - 'Assets/AarisWorld/Editor/AarisExplorerBuild.cs'
      - 'Assets/AarisWorld/Editor/AarisCodespaceAndroidBuild.cs'
      - 'Tools/Codespaces/android_apk.sh'
      - '.github/workflows/aaris-codespace-android-apk.yml'
      - '.github/workflows/aaris-android-install-compat-ci.yml'
jobs:
  android-install-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Verify native project Android package and no unsafe deployment changes
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          explorer=Path('Assets/AarisWorld/Editor/AarisExplorerBuild.cs').read_text()
          version=re.search(r'AndroidVersionName = "([^"]+)";',explorer)
          number=re.search(r'AndroidVersionCode = ([0-9]+);',explorer)
          assert version and number, "ANDROID_VERSION_CONSTANTS_MISSING"
          current_version,current_code=version.group(1),number.group(1)
          data=Path('ProjectSettings/ProjectSettings.asset').read_text()
          for line in (
              '  productName: Aaris Game',
              '  bundleVersion: '+current_version,
              '    Android: com.aaris.game',
              '  AndroidBundleVersionCode: '+current_code,
              '  AndroidTargetSdkVersion: 33',
              '  AndroidMinSdkVersion: 26',
              '  AndroidTargetArchitectures: 2',
              '  AndroidPreferredInstallLocation: 0',
          ):
              assert line in data, line
          assert '    Android: com.aaris.mapexplorer' not in data
          assert '  AndroidUseCustomKeystore: 1' not in data
          script=Path('Tools/Codespaces/android_apk.sh').read_text()
          assert 'bash Tools/Codespaces/apk_install_diagnostic.sh' in script
          for check in (
              'APK_INSTALL_DIAG_APKSIGNER_VERIFY_PASS',
              'APK_INSTALL_DIAG_ZIPALIGN_PASS',
              'apk_signature_v2=true',
              'apk_arm64_unity_lib=yes',
              'apk_min_sdk=26',
              'apk_target_sdk=33',
              'APK_INSTALLABILITY_SIGNATURE_MANIFEST_API33_VERIFIED',
              'com[.]aaris[.]game',
          ):
              assert check in script, check
          workflow=Path('.github/workflows/aaris-codespace-android-apk.yml').read_text()
          assert "gh codespace cp -e -c" in workflow
          assert "grep -qxF 'APK_INSTALLABILITY_SIGNATURE_MANIFEST_API33_VERIFIED'" in workflow
          assert "sha256sum -c AarisGame.sha256" in workflow
          assert 'AarisGame.apk' in workflow
          # Actual root cause: prebuild Unity callback reset modern APK
          # identity to old map explorer v6 immediately before Gradle export.
          assert 'IPreprocessBuildWithReport' in explorer
          assert 'public void OnPreprocessBuild(BuildReport report)' in explorer
          assert 'Configure();' in explorer
          for statement in (
              'PlayerSettings.productName = "Aaris Game";',
              'PlayerSettings.bundleVersion = AndroidVersionName;',
              'PlayerSettings.Android.bundleVersionCode = AndroidVersionCode;',
              'PlayerSettings.SetApplicationIdentifier(UnityEditor.Build.NamedBuildTarget.Android, "com.aaris.game");',
              'PlayerSettings.Android.targetSdkVersion = AndroidSdkVersions.AndroidApiLevel33;',
              'Builds/Android/AarisGame.apk',
          ):
              assert statement in explorer, statement
          assert 'com.aaris.mapexplorer' not in explorer
          assert 'AndroidApiLevelAuto' not in explorer
          builder=Path('Assets/AarisWorld/Editor/AarisCodespaceAndroidBuild.cs').read_text()
          for marker in (
              'ANDROID_GAME_IDENTITY_PREBUILD_MISMATCH',
              'ANDROID_GAME_IDENTITY_POSTBUILD_MISMATCH',
              'ExpectedAppId = "com.aaris.game"',
              'ExpectedVersionCode = AarisExplorerBuild.AndroidVersionCode',
              'AndroidSdkVersions.AndroidApiLevel33',
          ):
              assert marker in builder, marker
          print('APK_ANDROID_INSTALL_COMPAT_STATIC_PASSED')
          PY
          bash -n Tools/Codespaces/android_apk.sh
          bash -n Tools/Codespaces/apk_install_diagnostic.sh
          echo APK_ANDROID_INSTALL_BASH_VALID
