name: Aaris Vehicle Regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aaris-vehicle-regression.yml"
      - "Assets/AarisWorld/Scripts/AarisVehicle*.cs"
      - "Assets/Resources/AarisVehicles/**"
      - "Tools/Validation/check_vehicle_system.py"
      - "Tools/Validation/test_hud_pointer_orphan_recovery.py"
      - "Tools/Validation/test_vehicle_hud_state_restoration.py"
      - "Tools/Validation/test_vehicle_session_suspension.py"
      - "Tools/Validation/test_vehicle_motor_disable_authority.py"
      - "Tools/Validation/test_vehicle_camera_pacing.py"
      - "Docs/MAP_LAYOUT.json"

permissions:
  contents: read

concurrency:
  group: aaris-vehicle-regression-${{ github.sha }}
  cancel-in-progress: false

jobs:
  vehicle-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: Compile validator
        run: python3 -m py_compile Tools/Validation/check_vehicle_system.py
      - name: Validate authored vehicle assets and runtime contracts
        run: python3 Tools/Validation/check_vehicle_system.py
      - name: Verify orphaned HUD pointer release during EventSystem interruptions
        run: python3 Tools/Validation/test_hud_pointer_orphan_recovery.py
      - name: Verify original on-foot HUD states survive repeated vehicle transitions
        run: python3 Tools/Validation/test_vehicle_hud_state_restoration.py
      - name: Verify vehicle session disable and stale input recovery
        run: python3 Tools/Validation/test_vehicle_session_suspension.py
      - name: Verify disabled cars reject driver and held input without blocking safe exit
        run: python3 Tools/Validation/test_vehicle_motor_disable_authority.py
      - name: Verify vehicle camera pacing from 10 to 120 FPS
        run: python3 Tools/Validation/test_vehicle_camera_pacing.py
