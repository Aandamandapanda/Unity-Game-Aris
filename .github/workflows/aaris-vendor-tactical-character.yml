name: Vendor Tactical Soldier Character

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aaris-vendor-tactical-character.yml"

permissions:
  contents: write

concurrency:
  group: aaris-vendor-tactical-character
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Install Blender conversion tool
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy

      - name: Convert pinned tactical GLB to Unity FBX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/aaris-character
          python3 - <<'PY'
          import hashlib, pathlib, urllib.request
          url = "https://raw.githubusercontent.com/cktang88/3d-fps/main/public/assets/models/characters/soldier_tac.glb"
          expected_size = 4532132
          expected_git_blob = "b403237626e308c5a27be9683407b4450b03a246"
          out = pathlib.Path("/tmp/aaris-character/soldier_tac.glb")
          req = urllib.request.Request(url, headers={"User-Agent":"AarisCharacterVendor/1.0"})
          data = urllib.request.urlopen(req, timeout=60).read()
          assert len(data) == expected_size
          git_blob = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          assert git_blob == expected_git_blob, git_blob
          out.write_bytes(data)
          print("AARIS_TACTICAL_GLTF_PIN_OK", len(data), git_blob)
          PY

          cat > /tmp/aaris-character/convert.py <<'PY'
          import bpy, pathlib, re, os

          src = "/tmp/aaris-character/soldier_tac.glb"
          out_dir = pathlib.Path("Assets/Resources/AarisCharacters/Primary/TacticalSoldier")
          out_dir.mkdir(parents=True, exist_ok=True)
          out_fbx = out_dir / "TacticalSoldier.fbx"

          bpy.ops.wm.read_factory_settings(use_empty=True)
          bpy.ops.import_scene.gltf(filepath=src)

          # No source actions: the game already has the validated humanoid
          # locomotion graph and retargets its own clips.
          for action in list(bpy.data.actions):
              bpy.data.actions.remove(action)

          # Remove the upstream headset mesh: its own renderer notes this prop
          # floats above the cap. Keep the tactical body, cap, armour and pouches.
          for obj in list(bpy.data.objects):
              if obj.type != 'MESH':
                  continue
              mats = [m.name for m in obj.data.materials if m]
              if any("Headphone" in n for n in mats):
                  bpy.data.objects.remove(obj, do_unlink=True)

          # The GLB exporter appended unique numeric suffixes to Mixamo joints.
          # Normalize only those semantic bones so Unity can reuse the current
          # Humanoid avatar mapping and the existing two-hand/foot IK.
          rename = {}
          for arm in [o for o in bpy.data.objects if o.type == 'ARMATURE']:
              for bone in arm.data.bones:
                  old = bone.name
                  new = re.sub(r"_\d+$", "", old) if old.startswith("mixamorig:") else old
                  if new != old:
                      rename[old] = new
                      bone.name = new

          # Keep skin weights attached to renamed bones on every skinned mesh.
          for obj in [o for o in bpy.data.objects if o.type == 'MESH']:
              for vg in obj.vertex_groups:
                  if vg.name in rename:
                      vg.name = rename[vg.name]

          required = {
              "mixamorig:Hips","mixamorig:Spine","mixamorig:Spine1",
              "mixamorig:Neck","mixamorig:Head",
              "mixamorig:LeftShoulder","mixamorig:RightShoulder",
              "mixamorig:LeftArm","mixamorig:RightArm",
              "mixamorig:LeftForeArm","mixamorig:RightForeArm",
              "mixamorig:LeftHand","mixamorig:RightHand",
              "mixamorig:LeftUpLeg","mixamorig:RightUpLeg",
              "mixamorig:LeftLeg","mixamorig:RightLeg",
              "mixamorig:LeftFoot","mixamorig:RightFoot",
              "mixamorig:LeftToeBase","mixamorig:RightToeBase",
          }
          bones = {b.name for a in bpy.data.objects if a.type == 'ARMATURE' for b in a.data.bones}
          missing = sorted(required - bones)
          assert not missing, missing

          # Third-person mobile body: cap texture dimensions at 1024 before
          # embedding. This retains PBR detail while avoiding 2K/4K residency.
          tex_dir = pathlib.Path("/tmp/aaris-character/textures")
          tex_dir.mkdir(parents=True, exist_ok=True)
          image_count = 0
          for img in list(bpy.data.images):
              if img.name in {"Render Result", "Viewer Node"} or img.size[0] <= 0 or img.size[1] <= 0:
                  continue
              w, h = int(img.size[0]), int(img.size[1])
              scale = min(1.0, 1024.0 / max(w, h))
              if scale < 1.0:
                  img.scale(max(1, int(round(w * scale))), max(1, int(round(h * scale))))
              safe = re.sub(r"[^A-Za-z0-9_.-]+", "_", img.name).strip("_") or f"image_{image_count}"
              if not safe.lower().endswith(".png"):
                  safe += ".png"
              target = tex_dir / safe
              img.file_format = 'PNG'
              img.filepath_raw = str(target)
              img.save()
              img.pack()
              image_count += 1

          assert image_count >= 10, image_count

          # Tri count budget after removing the floating headset.
          tris = 0
          for obj in bpy.data.objects:
              if obj.type == 'MESH':
                  for poly in obj.data.polygons:
                      tris += max(1, len(poly.vertices) - 2)
          assert 10000 <= tris <= 40000, tris

          bpy.ops.export_scene.fbx(
              filepath=str(out_fbx),
              use_selection=False,
              object_types={'ARMATURE','MESH','EMPTY'},
              apply_unit_scale=True,
              apply_scale_options='FBX_SCALE_ALL',
              axis_forward='-Z',
              axis_up='Y',
              add_leaf_bones=False,
              bake_anim=False,
              path_mode='COPY',
              embed_textures=True,
              use_armature_deform_only=False,
          )
          print("AARIS_TACTICAL_FBX_EXPORTED", out_fbx.stat().st_size,
                "tris", tris, "images", image_count, "bones", len(bones))
          PY

          blender --background --python /tmp/aaris-character/convert.py
          test -s Assets/Resources/AarisCharacters/Primary/TacticalSoldier/TacticalSoldier.fbx
          echo "AARIS_TACTICAL_FBX_FILE_PRESENT"

      - name: Add stable Unity metadata and attribution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          dst = Path("Assets/Resources/AarisCharacters/Primary/TacticalSoldier")
          fbx = dst / "TacticalSoldier.fbx"
          assert fbx.is_file() and 1_000_000 < fbx.stat().st_size < 20_000_000

          # Reuse the already validated Humanoid mapping after the conversion
          # normalized tactical joint names to the current Mixamo bone names.
          src_meta = Path("Assets/Resources/AarisCharacters/Primary/RealisticSoldier/RealisticSoldier.fbx.meta").read_text()
          meta = re.sub(
              r"(?m)^guid: [0-9a-f]{32}$",
              "guid: 8cf0c99d7a934ae1b24937c60ccf6f21",
              src_meta,
              count=1,
          )
          (dst / "TacticalSoldier.fbx.meta").write_text(meta)

          attribution = "\n".join([
              "Tactical Soldier Character - source attribution",
              "Original 3D character: Military tactical suit (LowPolyGameReady)",
              "Creator: DanlyVostok (1799danly)",
              "https://sketchfab.com/3d-models/military-tactical-suit-lowpolygameready-ef698ce36b1545a78ce592dd3db4c7ed",
              "Creative Commons Attribution 4.0 International (CC BY 4.0)",
              "https://creativecommons.org/licenses/by/4.0/",
              "",
              "Redistributed via cktang88/3d-fps:",
              "public/assets/models/characters/soldier_tac.glb",
              "Pinned upstream Git blob: b403237626e308c5a27be9683407b4450b03a246",
              "",
              "Modified for Aaris:",
              "- converted GLB to FBX offline with Blender",
              "- normalized Mixamo exporter suffixes for Unity Humanoid retargeting",
              "- removed the floating headphone mesh noted by the upstream renderer",
              "- stripped source animations; Aaris uses its own validated Humanoid clips",
              "- capped embedded texture dimensions at 1024 for low-memory Android targets",
              "",
              "Attribution must be retained.",
              "",
          ])
          (dst / "ATTRIBUTION.txt").write_text(attribution)

          raw = subprocess.check_output(["strings","-n","5",str(fbx)], text=True, errors="replace")
          for bone in ("mixamorig:Hips","mixamorig:LeftHand","mixamorig:RightHand",
                       "mixamorig:LeftFoot","mixamorig:RightFoot"):
              assert bone in raw, bone
          assert "mixamorig:Hips_01" not in raw
          assert "HeadphonesT" not in raw
          print("AARIS_TACTICAL_FBX_CONTRACT_OK", fbx.stat().st_size)
          PY

      - name: Commit tactical body to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Aaris Character Vendor"
          git config user.email "actions@users.noreply.github.com"
          git add Assets/Resources/AarisCharacters/Primary/TacticalSoldier/
          if git diff --cached --quiet; then
            echo "AARIS_TACTICAL_CHARACTER_ALREADY_PRESENT"
            exit 0
          fi
          git commit -m "feat(character): vendor textured tactical soldier body"
          git reset --hard HEAD
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "AARIS_TACTICAL_CHARACTER_PUSHED"
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
