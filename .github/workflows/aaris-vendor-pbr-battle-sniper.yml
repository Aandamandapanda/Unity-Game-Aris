name: Aaris Vendor CC0 PBR BattleRifle and Sniper

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aaris-vendor-pbr-battle-sniper.yml'
      - 'Tools/Weapons/vendor_pbr_battle_sniper.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aaris-vendor-pbr-battle-sniper
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: true

      - name: Install deterministic image tooling
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir pillow==11.3.0

      - name: Verify converter syntax
        run: python3 -m py_compile Tools/Weapons/vendor_pbr_battle_sniper.py

      - name: Fetch pinned CC0 sources and convert to Unity-native PBR assets
        run: python3 Tools/Weapons/vendor_pbr_battle_sniper.py --download --repo .

      - name: Verify generated geometry and Android texture budgets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path("Assets/Resources/AarisWeapons/PBR")
          expected = {
              "BattleRifle": 5801,
              "Sniper": 19365,
          }
          for weapon, triangles in expected.items():
              folder = root / weapon
              obj = folder / (weapon + ".obj")
              mtl = folder / (weapon + ".mtl")
              assert obj.is_file() and mtl.is_file()
              lines = obj.read_text().splitlines()
              actual = sum(line.startswith("f ") for line in lines)
              assert actual == triangles, (weapon, actual, triangles)
              assert not any("LOD" in line for line in lines if line.startswith("o "))
              assert Path(str(folder) + ".meta").is_file()
              assert Path(str(obj) + ".meta").is_file()
              assert Path(str(mtl) + ".meta").is_file()

              bases = sorted(folder.glob("*_Base_Color.png"))
              normals = sorted(folder.glob("*_Normal.png"))
              packed = sorted(folder.glob("*_MetallicSmoothness.png"))
              assert len(bases) == len(normals) == len(packed) == 2
              for path in bases + normals:
                  with Image.open(path) as image:
                      assert max(image.size) <= 1024, (path, image.size)
                  assert Path(str(path) + ".meta").is_file()
              for path in packed:
                  with Image.open(path) as image:
                      assert max(image.size) <= 512, (path, image.size)
                  assert Path(str(path) + ".meta").is_file()

          provenance = Path("Docs/WEAPON_PBR_BATTLE_SNIPER_SOURCE.md")
          assert provenance.is_file()
          text = provenance.read_text()
          assert "41fc12d8bb095dcd03451060d2aa62a96d9667d5" in text
          assert "CC0-1.0" in text
          print("AARIS_PBR_BATTLE_SNIPER_GENERATED")
          PY
          git diff --check

      - name: Commit vendored offline PBR assets
        shell: bash
        run: |
          set -euo pipefail
          git add --             Assets/Resources/AarisWeapons/PBR/BattleRifle             Assets/Resources/AarisWeapons/PBR/BattleRifle.meta             Assets/Resources/AarisWeapons/PBR/Sniper             Assets/Resources/AarisWeapons/PBR/Sniper.meta             Docs/WEAPON_PBR_BATTLE_SNIPER_SOURCE.md
          if git diff --cached --quiet; then
            echo 'PBR BattleRifle/Sniper assets already match the pinned source'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Vendor pinned CC0 PBR BattleRifle and Sniper assets'
          # Checkout can expose legacy full-file/LFS bookkeeping as unstaged
          # residue even though the intended generated asset set is already
          # committed. Match the proven vehicle-vendor flow: reset only this
          # ephemeral runner back to the new commit before rebasing.
          git reset --hard HEAD
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:refs/heads/main; then
              echo 'AARIS_PBR_BATTLE_SNIPER_PUSHED'
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          echo '::error::Could not fast-forward vendor assets onto current main'
          exit 1
