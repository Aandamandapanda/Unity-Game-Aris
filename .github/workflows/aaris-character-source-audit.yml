name: Aaris Tactical Character Source Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aaris-character-source-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Verify upstream tactical soldier GLB contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, struct, urllib.request

          url = "https://raw.githubusercontent.com/cktang88/3d-fps/main/public/assets/models/characters/soldier_tac.glb"
          expected_size = 4532132
          expected_git_blob = "b403237626e308c5a27be9683407b4450b03a246"

          req = urllib.request.Request(url, headers={"User-Agent":"AarisCharacterAudit/1.0"})
          data = urllib.request.urlopen(req, timeout=60).read()
          assert len(data) == expected_size, (len(data), expected_size)
          git_blob = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          assert git_blob == expected_git_blob, git_blob

          magic, version, total = struct.unpack_from("<4sII", data, 0)
          assert magic == b"glTF" and version == 2 and total == len(data)
          off = 12
          doc = None
          while off + 8 <= len(data):
              n, kind = struct.unpack_from("<II", data, off)
              off += 8
              chunk = data[off:off+n]
              off += n
              if kind == 0x4E4F534A:
                  doc = json.loads(chunk.rstrip(b"\x00 \t\r\n").decode("utf-8"))
          assert doc is not None

          skins = doc.get("skins", [])
          meshes = doc.get("meshes", [])
          nodes = doc.get("nodes", [])
          mats = doc.get("materials", [])
          imgs = doc.get("images", [])
          assert skins, "TACTICAL_BODY_HAS_NO_SKIN"
          assert meshes, "TACTICAL_BODY_HAS_NO_MESH"
          assert imgs, "TACTICAL_BODY_HAS_NO_EMBEDDED_TEXTURES"
          skinned_nodes = [n for n in nodes if "skin" in n and "mesh" in n]
          assert skinned_nodes, "TACTICAL_BODY_HAS_NO_SKINNED_MESH_NODE"

          jointed = 0
          triangles = 0
          accessors = doc.get("accessors", [])
          for mesh in meshes:
              for prim in mesh.get("primitives", []):
                  attrs = prim.get("attributes", {})
                  if "JOINTS_0" in attrs and "WEIGHTS_0" in attrs:
                      jointed += 1
                  idx = prim.get("indices")
                  if idx is not None:
                      triangles += accessors[idx].get("count", 0) // 3
          assert jointed > 0, "TACTICAL_BODY_MESH_NOT_SKINNED"
          assert 1000 <= triangles <= 80000, triangles

          names = [m.get("name","") for m in mats]
          mime = [i.get("mimeType","") for i in imgs]
          assert any(x in ("image/png","image/jpeg","image/webp") for x in mime), mime

          # The Unity player relies on Humanoid retarget + hand/foot IK.
          # Lock the source to the same Mixamo-style semantic skeleton rather
          # than assuming that "has a skin" is enough.
          joint_nodes = set()
          for skin in skins:
              joint_nodes.update(skin.get("joints", []))
          joint_names = [nodes[i].get("name","") for i in sorted(joint_nodes)]
          def key(name):
              name = name.replace("mixamorig:", "").replace("mixamorig", "")
              while name and name[-1].isdigit():
                  name = name[:-1]
              return name.rstrip("_")
          keys = {key(n) for n in joint_names}
          required = {
              "Hips","Spine","Spine1","Neck","Head",
              "LeftShoulder","RightShoulder","LeftArm","RightArm",
              "LeftForeArm","RightForeArm","LeftHand","RightHand",
              "LeftUpLeg","RightUpLeg","LeftLeg","RightLeg",
              "LeftFoot","RightFoot","LeftToeBase","RightToeBase",
          }
          missing = sorted(required - keys)
          assert not missing, ("TACTICAL_HUMANOID_BONES_MISSING", missing, joint_names)

          print("AARIS_TACTICAL_SOURCE_OK")
          print("bytes", len(data))
          print("skins", len(skins), "joints", [len(s.get("joints",[])) for s in skins])
          print("meshes", len(meshes), "skinned_primitives", jointed, "triangles", triangles)
          print("materials", names)
          print("images", len(imgs), mime)
          print("skinned_nodes", [(n.get("name",""), n.get("mesh"), n.get("skin")) for n in skinned_nodes])
          print("humanoid_joint_names", joint_names)

          # Audit the upstream animation source separately. Its soldier.glb
          # carries retargeted 100STYLE CC-BY mocap plus fallback library clips.
          mocap_url = "https://raw.githubusercontent.com/cktang88/3d-fps/main/public/assets/models/characters/soldier.glb"
          mocap_size = 3094592
          mocap_git_blob = "b00ed33108f2579880c82cd27d10f9237ff3a219"
          req = urllib.request.Request(mocap_url, headers={"User-Agent":"AarisCharacterAudit/1.0"})
          motion_data = urllib.request.urlopen(req, timeout=60).read()
          assert len(motion_data) == mocap_size, len(motion_data)
          import hashlib
          got_blob = hashlib.sha1(
              b"blob " + str(len(motion_data)).encode() + b"\0" + motion_data
          ).hexdigest()
          assert got_blob == mocap_git_blob, got_blob
          off = 12
          motion_doc = None
          while off + 8 <= len(motion_data):
              n, kind = struct.unpack_from("<II", motion_data, off)
              off += 8
              chunk = motion_data[off:off+n]
              off += n
              if kind == 0x4E4F534A:
                  motion_doc = json.loads(
                      chunk.rstrip(b"\x00 \t\r\n").decode("utf-8")
                  )
          assert motion_doc is not None
          motion_names = [a.get("name","") for a in motion_doc.get("animations",[])]
          mocap_names = sorted(n for n in motion_names if n.startswith("mocap_"))
          assert len(mocap_names) >= 8, mocap_names
          assert any(n.startswith("mocap_walk_") for n in mocap_names)
          assert any(n.startswith("mocap_run_") for n in mocap_names)
          assert any(n.startswith("mocap_crouch") for n in mocap_names)
          print("AARIS_100STYLE_MOCAP_SOURCE_OK", len(mocap_names))
          print("mocap_animation_names", mocap_names)
          accessors = motion_doc.get("accessors", [])
          durations = {}
          for anim in motion_doc.get("animations", []):
              name = anim.get("name","")
              if name not in mocap_names:
                  continue
              lo, hi = None, None
              for sampler in anim.get("samplers", []):
                  acc = accessors[sampler["input"]]
                  amin = float((acc.get("min") or [0.0])[0])
                  amax = float((acc.get("max") or [0.0])[0])
                  lo = amin if lo is None else min(lo, amin)
                  hi = amax if hi is None else max(hi, amax)
              durations[name] = (lo or 0.0, hi or 0.0, (hi or 0.0) - (lo or 0.0))
          selected = ["mocap_walk_F@1.1733", "mocap_jog_F@1.7529",
                      "mocap_run_F@2.8652", "mocap_crouch_F@0.6906"]
          for name in selected:
              assert name in durations and durations[name][2] > 0.15, (name, durations)
          print("mocap_selected_durations", {name: durations[name] for name in selected})
          PY
